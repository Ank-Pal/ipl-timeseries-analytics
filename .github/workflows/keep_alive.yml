name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC) to ensure the app never hibernates
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the GitHub Actions tab anytime

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://ankur-pal-ipl-analytics.streamlit.app/
          timeout: 90
